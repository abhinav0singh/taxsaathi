AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: TaxSaathi - calculate/parseIncome/explain Lambdas + HTTP API + DynamoDB (SAM)

Parameters:
  BedrockModelId:
    Type: String
    Default: apac.amazon.nova-lite-v1:0
    Description: >-
      Bedrock INFERENCE PROFILE id, used as the Converse API's modelId and
      to scope the inference-profile IAM resource. Includes the apac.
      geography prefix -- amazon.nova-lite-v1:0 is not directly hosted in
      ap-south-1 (confirmed against AWS's model-card region table), so
      this profile routes the request to wherever in APAC actually hosts
      it (Tokyo/Sydney/Jakarta).
  BedrockUnderlyingModelId:
    Type: String
    Default: amazon.nova-lite-v1:0
    Description: >-
      The BARE model id, WITHOUT the apac. prefix. Cross-region inference
      profile invocation is authorized against TWO separate IAM resources:
      the inference-profile ARN (uses BedrockModelId, WITH the prefix) and
      the underlying foundation-model ARN in each destination region (uses
      THIS value, WITHOUT the prefix -- the prefix is specific to the
      inference-profile resource type and does not appear in the
      foundation-model resource name). Reusing one parameter for both
      previously caused a real, deployed AccessDeniedException naming the
      foundation-model resource even though the inference-profile
      permission was correct -- this split exists specifically to prevent
      that mismatch recurring silently.

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 10
    MemorySize: 128
  HttpApi:
    CorsConfiguration:
      AllowOrigins:
        - "*"
      AllowMethods:
        - POST
        - OPTIONS
      AllowHeaders:
        - Content-Type
      MaxAge: 300

Resources:
  CalculateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: taxsaathi-calculate
      CodeUri: lambda/
      Handler: app.handler
      Events:
        CalculateApi:
          Type: HttpApi
          Properties:
            Path: /calculate
            Method: POST

  TaxExplainersTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: TaxExplainers
      PrimaryKey:
        Name: topic
        Type: String
      SSESpecification:
        SSEEnabled: true

  ExplainFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: taxsaathi-explain
      CodeUri: lambda-explain/
      Handler: app.handler
      Timeout: 15
      Environment:
        Variables:
          TABLE_NAME: !Ref TaxExplainersTable
          BEDROCK_MODEL_ID: !Ref BedrockModelId
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TaxExplainersTable
        - Statement:
            - Sid: InvokeApacInferenceProfile
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModelId}"
            - Sid: ResolveInferenceProfile
              # Not confirmed by a deployed error yet -- AWS's inference-
              # profile prerequisites doc lists this as required to
              # resolve a profile to its underlying model. Added
              # defensively since it's a cheap, read-only grant, not
              # because we've seen it fail without it.
              Effect: Allow
              Action: bedrock:GetInferenceProfile
              Resource: !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModelId}"
            - Sid: InvokeUnderlyingFoundationModelAnyRegion
              # Live testing showed AccessDeniedException on THREE
              # different regions across three deploys (ap-southeast-2,
              # ap-south-1, ap-northeast-2) -- the inference profile
              # routes across more regions than any docs table listed,
              # and enumerating them one at a time was a losing game
              # against a moving target. Region wildcarded deliberately;
              # model name and action stay exact. This is the realistic
              # middle ground for cross-region profiles, not a shortcut
              # taken out of laziness -- "cross-region" inherently means
              # the destination isn't fixed in advance.
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub "arn:aws:bedrock:*::foundation-model/${BedrockUnderlyingModelId}"
      Events:
        ExplainApi:
          Type: HttpApi
          Properties:
            Path: /explain
            Method: POST

  ParseIncomeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: taxsaathi-parse-income
      CodeUri: lambda-parse-income/
      Handler: app.handler
      Timeout: 15
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
      Policies:
        - Statement:
            - Sid: InvokeApacInferenceProfile
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModelId}"
            - Sid: ResolveInferenceProfile
              Effect: Allow
              Action: bedrock:GetInferenceProfile
              Resource: !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModelId}"
            - Sid: InvokeUnderlyingFoundationModelAnyRegion
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub "arn:aws:bedrock:*::foundation-model/${BedrockUnderlyingModelId}"
      Events:
        ParseIncomeApi:
          Type: HttpApi
          Properties:
            Path: /parseIncome
            Method: POST

Outputs:
  CalculateApiUrl:
    Description: Invoke URL for POST /calculate
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/calculate"
  ExplainApiUrl:
    Description: Invoke URL for POST /explain
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/explain"
  ParseIncomeApiUrl:
    Description: Invoke URL for POST /parseIncome
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/parseIncome"
  TaxExplainersTableName:
    Description: DynamoDB table name, for the seed script
    Value: !Ref TaxExplainersTable

AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: TaxSaathi - calculate Lambda + HTTP API (SAM)

Globals:
  Function:
    Runtime: nodejs22.x   # verify this is still a current supported runtime in the console before deploying
    Timeout: 10
    MemorySize: 128

Resources:
  CalculateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: taxsaathi-calculate
      CodeUri: lambda/
      Handler: app.handler
      # No Policies here on purpose. SSD.md section 3: this function needs
      # nothing beyond basic CloudWatch logging, which SAM's auto-generated
      # execution role already grants by default when no Role/Policies are
      # specified. Adding Policies here would be adding permissions this
      # function doesn't need -- the absence of this block IS the
      # least-privilege choice, not a gap.
      Events:
        CalculateApi:
          Type: HttpApi
          Properties:
            Path: /calculate
            Method: POST

  # TaxExplainers table (SSD.md section 7): single-table key-value lookup,
  # no sort key needed -- AWS::Serverless::SimpleTable is SAM's simplified
  # shorthand for exactly this shape (it expands to a full
  # AWS::DynamoDB::Table underneath, just with less boilerplate to write).
  TaxExplainersTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: TaxExplainers
      PrimaryKey:
        Name: topic
        Type: String
      # No ProvisionedThroughput specified -- SimpleTable defaults to
      # on-demand (PAY_PER_REQUEST) billing when this is omitted, which is
      # what we want: no capacity to plan for 4 rows and unpredictable
      # demo traffic. (BillingMode isn't a valid property on SimpleTable
      # directly -- caught by cfn-lint, corrected here.)
      SSESpecification:
        SSEEnabled: true

  ExplainFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: taxsaathi-explain
      CodeUri: lambda-explain/
      Handler: app.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref TaxExplainersTable
      # DynamoDBReadPolicy is a SAM Policy Template -- a named, pre-built
      # least-privilege IAM policy shape (GetItem/Query/Scan/BatchGetItem
      # on exactly the table you name, nothing else -- no write access, no
      # other tables). This is what SSD.md section 3 means by "SAM makes
      # this natural" -- you name the shape, SAM writes the IAM JSON.
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TaxExplainersTable
      Events:
        ExplainApi:
          Type: HttpApi
          Properties:
            Path: /explain
            Method: POST

Outputs:
  CalculateApiUrl:
    Description: Invoke URL for POST /calculate
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/calculate"
  ExplainApiUrl:
    Description: Invoke URL for POST /explain
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/explain"
  TaxExplainersTableName:
    Description: DynamoDB table name, for the seed script
    Value: !Ref TaxExplainersTable
